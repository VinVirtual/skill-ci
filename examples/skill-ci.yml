# Copy to .github/workflows/skill-ci.yml in your skill repository.
#
# Two jobs, on purpose:
#   static    reads files only (SKILL.md, README, LICENSE, secrets, script safety, media). Safe for every pull request.
#   commands  runs your tests in a fresh clone and the demo: that is running the repository's code with this job's
#             privileges, so it runs only on pushes to main, in its own job with no token permissions, no secrets,
#             no stored credentials and nothing after it.
# Never use pull_request_target, workflow_run or issue_comment to run either job on someone else's code.
name: skill-ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Replace the zeros with the full commit SHA of the skill-ci release you use (a tag can be moved).
      - uses: VinVirtual/skill-ci@0000000000000000000000000000000000000000 # v0.1.0
        with:
          path: .
          lock-config: "true"          # a pull request cannot hide findings through .skill-ci.yml or allow comments
          # fail-on: warning           # stricter: warnings fail the job too

  commands:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}                    # a private repository needs contents: read here to check out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: VinVirtual/skill-ci@0000000000000000000000000000000000000000 # v0.1.0
        with:
          path: .
          run-commands: "true"         # runs your repository's code; see "Security" in the skill-ci README
      # no steps after this one: anything the repository's code left behind must find nothing to use
